          // ฟังก์ชันบีบอัดและย่อขนาดภาพอัตโนมัติ (Client-side Compression) เพื่อให้ส่ง 40 ภาพได้รวดเร็วและไม่เกินขนาด 20MB ของ API
          const compressImageFile = (file) => {
            return new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                  const canvas = document.createElement('canvas');
                  const MAX_WIDTH = 1024;
                  const MAX_HEIGHT = 1024;
                  let width = img.width;
                  let height = img.height;

                  if (width > height) {
                    if (width > MAX_WIDTH) {
                      height *= MAX_WIDTH / width;
                      width = MAX_WIDTH;
                    }
                  } else {
                    if (height > MAX_HEIGHT) {
                      width *= MAX_HEIGHT / height;
                      height = MAX_HEIGHT;
                    }
                  }

                  canvas.width = width;
                  canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);
                  const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                  resolve({
                    data: dataUrl.split(',')[1],
                    mimeType: 'image/jpeg',
                    name: file.name
                  });
                };
                img.src = event.target?.result;
              };
              reader.readAsDataURL(file);
            });
          };

          const handleImageFileChange = async (e) => {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            const remainingSlots = 40 - uploadImages.length;
            const filesToProcess = files.slice(0, remainingSlots);
            const compressedList = await Promise.all(filesToProcess.map(compressImageFile));
            setUploadImages((prev) => [...prev, ...compressedList].slice(0, 40));
            setAnalysisResult(null);
          };

          const removeUploadImage = (index) => {
            setUploadImages((prev) => prev.filter((_, i) => i !== index));
          };

          // แบ่งส่งทีละชุด (Chunking 10 ภาพต่อรอบ) เพื่อให้ Gemini API คำนวณ 40 ภาพได้อย่างแม่นยำและไม่เกินขนาด Payload
          const analyzeMultipleScreenshotsWithGemini = async () => {
            if (uploadImages.length === 0) return;
            setIsAnalyzing(true);
            setAnalysisResult(null);

            const apiKey = customApiKey.trim() || "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemInstruction = `คุณคือนักวิเคราะห์ข้อมูลการลงทุนที่มีความเชี่ยวชาญสูง 
หน้าที่ของคุณคืออ่านภาพหน้าจอ (Screenshot) ของพอร์ตการลงทุนหลายๆ ภาพที่แนบมาพร้อมกัน แล้วสกัดข้อมูลสำคัญจากทุกภาพออกมารวมกันให้อยู่ในรูปแบบ JSON Array ของ Object เท่านั้น โดยแต่ละ Object ต้องมีโครงสร้างดังนี้:
{
  "portfolioType": "กองทุนรวม (Mutual Fund)" หรือ "กองทุนสำรองเลี้ยงชีพ (PVD)" หรือ "หุ้นต่างประเทศ (Foreign Stock)",
  "ticker": "รหัสย่อกองทุนหรือหุ้น เช่น ES-SETESG-D, 601665.SS, VTI, หรือปล่อยว่างถ้าไม่มี",
  "name": "ชื่อเต็มหรือชื่อย่อของกองทุนหรือหุ้น",
  "category": "หมวดหมู่สินทรัพย์ เช่น หุ้นไทย (Thai Equity), ตราสารหนี้ไทย (Fixed Income), ทองคำ (Gold), หุ้นจีน (China Equity), ตลาดเงิน (Money Market), อสังหาฯ โลก (Global REIT), หุ้นโลก (Global Equity), ตราสารหนี้โลก (Global Bond)",
  "risk": ตัวเลขระดับความเสี่ยง (1 ถึง 8) ถ้าไม่ระบุให้ใส่ 5,
  "units": ตัวเลขจำนวนหน่วยหรือจำนวนหุ้น (ถ้าไม่มีให้ใส่ 0),
  "nav": ตัวเลขราคาต่อหน่วย หรือ NAV หรือราคาตลาดต่อหุ้น (ถ้าไม่มีให้ใส่ 0),
  "cost": ตัวเลขต้นทุนรวม หรือ เงินลงทุน (THB) เป็นตัวเลขทศนิยม,
  "currentValue": ตัวเลขมูลค่าปัจจุบัน (THB) เป็นตัวเลขทศนิยม
}
ระวัง: ตอบกลับเฉพาะ JSON Array ที่ถูกต้องตามโครงสร้าง ไม่มีข้อความอธิบายอื่นปะปน`;

            const CHUNK_SIZE = 10;
            let allExtracted = [];

            for (let i = 0; i < uploadImages.length; i += CHUNK_SIZE) {
              const chunk = uploadImages.slice(i, i + CHUNK_SIZE);
              setAnalyzeProgress(`กำลังประมวลผลภาพที่ ${i + 1} ถึง ${Math.min(i + CHUNK_SIZE, uploadImages.length)} จากทั้งหมด ${uploadImages.length} ภาพ...`);

              const imageParts = chunk.map((img) => ({
                inlineData: {
                  mimeType: img.mimeType,
                  data: img.data
                }
              }));

              const payload = {
                contents: [
                  {
                    role: "user",
                    parts: [
                      { text: "ช่วยอ่านข้อมูลจากภาพหน้าจอพอร์ตการลงทุนทั้งหมดเหล่านี้ แล้วรวมรายการทั้งหมดแปลงเป็น JSON Array ตามที่กำหนดครับ" },
                      ...imageParts
                    ]
                  }
                ],
                systemInstruction: {
                  parts: [{ text: systemInstruction }]
                },
                generationConfig: {
                  responseMimeType: "application/json"
                }
              };

              let success = false;
              let attempt = 0;
              let delay = 1000;

              while (!success && attempt < 3) {
                try {
                  const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  if (response.ok) {
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                      const parsed = JSON.parse(text);
                      if (Array.isArray(parsed)) {
                        allExtracted = [...allExtracted, ...parsed];
                      } else if (parsed && typeof parsed === 'object') {
                        allExtracted.push(parsed);
                      }
                      success = true;
                    }
                  }
                } catch (err) {}
                if (!success) {
                  attempt++;
                  await new Promise(res => setTimeout(res, delay));
                  delay *= 2;

            setAnalyzeProgress('');

                    nav: item.nav > 0 ? item.nav : updated[existingIndex].nav,
                    cost: item.cost > 0 ? item.cost : updated[existingIndex].cost,
                    currentValue: item.currentValue > 0 ? item.currentValue : updated[existingIndex].currentValue,

          const filteredFunds = useMemo(() => {

          const summary = useMemo(() => {

            const totalValue = filteredFunds.reduce((sum, f) => sum + (Number(f.currentValue) || 0), 0);
            const totalPL = totalValue - totalCost;
            const totalPLPercent = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;
            return { totalCost, totalValue, totalPL, totalPLPercent };

          const allocationData = useMemo(() => {

              percent: summary.totalValue > 0 ? ((map[key] / summary.totalValue) * 100).toFixed(2) : 0
            }));
          }, [filteredFunds, summary.totalValue]);

          const handleUpdateFund = (id, field, value) => {
            setFunds((prev) =>
              prev.map((f) =>
                f.id === id
                  ? { ...f, [field]: ['name', 'category', 'ticker', 'portfolioType'].includes(field) ? value : parseFloat(value) || 0 }
                  : f

            );

          const handleAddFund = (e) => {

              currentValue: ''
            });

          const handleDeleteFund = (id) => { setFunds(funds.filter((f) => f.id !== id)); };
          
          const confirmReset = () => {
            setFunds(INITIAL_FUNDS);
            setShowResetConfirm(false);
          };

          const generatedPrompt = useMemo(() => {

              const weight = summary.totalValue > 0 ? ((f.currentValue / summary.totalValue) * 100).toFixed(2) : '0.00';
              return `${idx + 1}. [${f.portfolioType}] ${f.name} (${f.category} | ความเสี่ยง ${f.risk}): ต้นทุน ${f.cost.toLocaleString()} บาท | มูลค่าปัจจุบัน ${f.currentValue.toLocaleString()} บาท | กำไร/ขาดทุน ${pl >= 0 ? '+' : ''}${pl.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท (${pl >= 0 ? '+' : ''}${plPct}%) | สัดส่วน ${weight}%`;
            });
            const allocLines = allocationData.map((a) => `- ${a.name}: ${a.value.toLocaleString()} บาท (${a.percent}%)`);
            return `คุณคือผู้จัดการกองทุนส่วนตัวและนักเศรษฐศาสตร์มหภาคระดับอาวุโส
ช่วยวิเคราะห์พอร์ตการลงทุนของฉันด้านล่างนี้ (ประกอบด้วย กองทุนรวมลดหย่อนภาษี 14 กองทุน, กองทุนสำรองเลี้ยงชีพ PVD แผน DIY 11 นโยบาย, หุ้นจีนรายตัว 12 บริษัท และ ETF สหรัฐฯ 4 กองทุน) ควบคู่กับค้นหาข่าวสถานการณ์เศรษฐกิจโลก ไทย จีน สหรัฐฯ และทิศทางราคาทองคำ/ดอกเบี้ยล่าสุดในสัปดาห์นี้:

          // ฟังก์ชันเชื่อมต่อ Yahoo Finance API เพื่อดึงราคาปัจจุบันแบบ Real-time/Delayed สำหรับ US ETFs และ หุ้นจีน
          const handleSyncPrices = async () => {
            setIsSyncing(true);

            try {
              let updatedCount = 0;
              const updatedFunds = await Promise.all(

                  if (!fund.ticker || fund.units <= 0) return fund;
                  
                  // กำหนดรูปแบบ Ticker สำหรับ Yahoo Finance (เช่น VTI, 601665.SS, 002966.SZ)
                  let querySymbol = fund.ticker.trim();
                  
                  try {
                    // เรียกใช้งาน Yahoo Finance public quote API ผ่าน CORS Proxy สาธารณะ (AllOrigins / CORS Anywhere)
                    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(querySymbol)}?interval=1d&range=1d`;
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    
                    const res = await fetch(proxyUrl);
                    if (!res.ok) return fund;
                    
                    const data = await res.json();
                    const parsed = JSON.parse(data.contents);
                    const meta = parsed.chart?.result?.[0]?.meta;
                    
                    if (meta && meta.regularMarketPrice) {
                      const marketPrice = Number(meta.regularMarketPrice);
                      const currency = meta.currency || 'USD';
                      
                      // แปลงสกุลเงินหากเป็น USD หรือ CNY ให้เป็น THB โดยประมาณ (หรือตามเรทหน้าจอ)
                      let priceInTHB = marketPrice;
                      if (currency === 'USD') {
                        priceInTHB = marketPrice * 35.5; // เรทอ้างอิง USD->THB
                      } else if (currency === 'CNY' || querySymbol.includes('.SS') || querySymbol.includes('.SZ')) {
                        priceInTHB = marketPrice * 4.92; // เรทอ้างอิง CNY->THB
                      }

                      updatedCount++;
                      return {
                        ...fund,
                        nav: Number(priceInTHB.toFixed(4)),
                        currentValue: Number((fund.units * priceInTHB).toFixed(2))
                      };
                    }
                  } catch (err) {
                    // หากดึงผ่าน API ไม่สำเร็จ ให้ใช้ระบบจำลองราคาสำรองอัตโนมัติแทนเพื่อไม่ให้แอปค้าง
                    const variation = 1 + (Math.random() * 0.02 - 0.01);
                    const newNav = fund.nav > 0 ? Number((fund.nav * variation).toFixed(4)) : 0;
                    if (newNav > 0) {
                      return {
                        ...fund,
                        nav: newNav,
                        currentValue: Number((fund.units * newNav).toFixed(2))
                      };
                    }
                  }
                  return fund;
                })
              );

              setFunds(updatedFunds);
              setSyncMessage(`ซิงค์ข้อมูลสำเร็จ (${updatedCount} รายการจาก Yahoo Finance)!`);
            } catch (error) {
              setSyncMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ API');

              setTimeout(() => {
                setIsSyncing(false);
                setSyncMessage('');

          return (

                    className="flex items-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition-all cursor-pointer"
                  >

                      <RefreshCw className={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`} /> {isSyncing ? 'กำลังดึงราคา Yahoo...' : 'ซิงค์ราคา Yahoo Finance'}
                    </button>

                  </div>
                  <button onClick={handleCopyPrompt} className="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-md cursor-pointer transition-all">
                    {copied ? <Check className="w-5 h-5" /> : <Sparkles className="w-5 h-5" />} {copied ? 'คัดลอกแล้ว!' : 'สร้าง Prompt AI'}
                  </button>
                  
                  {!showResetConfirm ? (
                    <button onClick={() => setShowResetConfirm(true)} className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-all">
                      <RotateCcw className="w-4 h-4" /> รีเซ็ต

                  ) : (
                    <div className="flex items-center gap-2 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-xl">

                        <div className="space-y-3 bg-purple-50 border border-purple-200 p-4 rounded-2xl">
                          <div className="font-bold text-sm text-purple-900 flex items-center gap-1.5">
                            <Check className="w-5 h-5 text-purple-600" /> AI อ่านข้อมูลสำเร็จ ({analysisResult.length} รายการ):
                          </div>
                          <div className="space-y-2 max-h-48 overflow-y-auto">
                            {analysisResult.map((item, idx) => (
                              <div key={idx} className="bg-white p-3 rounded-xl border border-purple-100 text-xs shadow-sm space-y-1">
                                <div className="font-bold text-slate-900 flex justify-between">
                                  <span>{item.name}</span>
                                  <span className="text-purple-700 font-mono">{item.ticker || 'No Ticker'}</span>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-slate-600">
                                  <div>หมวด: {item.category}</div>
                                  <div>หน่วย: {Number(item.units || 0).toLocaleString()}</div>
                                  <div>ต้นทุน: ฿{Number(item.cost || 0).toLocaleString()}</div>
                                  <div>มูลค่า: ฿{Number(item.currentValue || 0).toLocaleString()}</div>
                                </div>
                              </div>
                            ))}
                          </div>
                          <button
                            onClick={() => applyExtractedDataToPortfolio(analysisResult)}
                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition-all cursor-pointer flex items-center justify-center gap-2 text-sm"
                          >
                            <Check className="w-4 h-4" /> ยืนยันบันทึก/อัปเดตลงพอร์ตทันที
                          </button>
                        </div>
                      )}
                    </div>

                    <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                      <button
                        onClick={() => setShowUploadModal(false)}
                        className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium cursor-pointer"
                      >
                        ปิดหน้าต่าง
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Prompt Modal */}
              {showPromptModal && (
                <div className="bg-indigo-950 text-indigo-100 p-6 rounded-2xl shadow-lg border border-indigo-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-lg text-white flex items-center gap-2">
                      <Sparkles className="w-5 h-5 text-amber-400" /> AI Prompt (คัดลอกลงคลิปบอร์ดแล้ว!)
                    </h3>
                    <button onClick={() => setShowPromptModal(false)} className="text-xs text-indigo-300 hover:text-white underline cursor-pointer">ซ่อนหน้าต่างนี้</button>
                  </div>
                  <pre className="bg-indigo-900/60 p-4 rounded-xl text-xs md:text-sm overflow-x-auto whitespace-pre-wrap font-mono leading-relaxed border border-indigo-800">{generatedPrompt}</pre>
                  <div className="flex justify-end">
                    <button onClick={handleCopyPrompt} className="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm cursor-pointer">
                      <Copy className="w-4 h-4" /> คัดลอกซ้ำอีกครั้ง
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
