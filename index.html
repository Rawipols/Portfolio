<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAWIPOL's Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- PropTypes (Required by Recharts UMD) -->
    <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script crossorigin src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid } = window.Recharts;
        
        // Native SVG Icon components (Prevents DOM conflicts with React)
        const Plus = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const Trash2 = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        );
        const Copy = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const Check = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>
        );
        const RotateCcw = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );
        const TrendingUp = ({ className = "w-8 h-8" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const Wallet = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        );
        const ArrowUpRight = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        );
        const ArrowDownRight = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m7 7 10 10"/><path d="M17 7v10H7"/></svg>
        );
        const Sparkles = ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
        );
        const RefreshCw = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        );

        const INITIAL_FUNDS = [
          { id: '1', ticker: 'ES-SETESG-D', name: 'ES-SETESG-ThaiESG-D', category: 'หุ้นไทย (Thai ESG)', risk: 6, units: 16302.9301, cost: 150000.00, currentValue: 192646.83 },
          { id: '2', ticker: 'UTSEQ-THAIESG', name: 'UTSEQ-THAIESG', category: 'หุ้นไทย (Thai ESG)', risk: 6, units: 15289.8964, cost: 150000.00, currentValue: 175498.96 },
          { id: '3', ticker: 'UTSB-THAIESG', name: 'UTSB-THAIESG', category: 'ตราสารหนี้ไทย (Thai ESG)', risk: 3, units: 15006.1525, cost: 150000.00, currentValue: 151653.68 },
          { id: '4', ticker: 'K-ESGBF', name: 'K-ESGBF-ThaiESG', category: 'ตราสารหนี้ไทย (Thai ESG)', risk: 4, units: 15000.0000, cost: 150000.00, currentValue: 149281.50 },
          { id: '5', ticker: 'SCBGOLDH', name: 'SCBGOLDHRMF', category: 'ทองคำ (Gold RMF)', risk: 8, units: 7905.9358, cost: 150000.00, currentValue: 147644.14 },
          { id: '6', ticker: 'MCHINASSF', name: 'MCHINASSF', category: 'หุ้นจีน (China SSF)', risk: 6, units: 11790.8139, cost: 100000.00, currentValue: 109623.91 },
          { id: '7', ticker: 'ONE-ALLCHINA', name: 'ONE-ALLCHINA-ASSF', category: 'หุ้นจีน (China SSF)', risk: 6, units: 9997.2404, cost: 100000.00, currentValue: 78048.46 },
          { id: '8', ticker: 'TCMF', name: 'TCMF', category: 'ตลาดเงิน (Money Market)', risk: 1, units: 37.5335, cost: 600.00, currentValue: 609.56 },
          { id: '9', ticker: 'ES-CASH', name: 'ES-CASH', category: 'ตลาดเงิน (Money Market)', risk: 1, units: 20.6617, cost: 300.00, currentValue: 300.44 },
          { id: '10', ticker: 'KKP-MP', name: 'KKP MP', category: 'ตลาดเงิน (Money Market)', risk: 1, units: 15.4329, cost: 200.00, currentValue: 200.36 },
        ];

        const COLORS = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];

        function App() {
          const [funds, setFunds] = useState(() => {
            const saved = localStorage.getItem('my_fund_portfolio_v1');
            if (saved) {
              try { return JSON.parse(saved); } catch (e) { return INITIAL_FUNDS; }
            }
            return INITIAL_FUNDS;
          });

          const [newFund, setNewFund] = useState({ ticker: '', name: '', category: 'หุ้นไทย (Thai ESG)', risk: 6, units: '', cost: '', currentValue: '' });
          const [copied, setCopied] = useState(false);
          const [showPromptModal, setShowPromptModal] = useState(false);
          const [showResetConfirm, setShowResetConfirm] = useState(false);
          const [isSyncing, setIsSyncing] = useState(false);

          useEffect(() => {
            localStorage.setItem('my_fund_portfolio_v1', JSON.stringify(funds));
          }, [funds]);

          const summary = useMemo(() => {
            const totalCost = funds.reduce((sum, f) => sum + (Number(f.cost) || 0), 0);
            const totalValue = funds.reduce((sum, f) => sum + (Number(f.currentValue) || 0), 0);
            const totalPL = totalValue - totalCost;
            const totalPLPercent = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;
            return { totalCost, totalValue, totalPL, totalPLPercent };
          }, [funds]);

          const allocationData = useMemo(() => {
            const map = {};
            funds.forEach((f) => {
              const val = Number(f.currentValue) || 0;
              map[f.category] = (map[f.category] || 0) + val;
            });
            return Object.keys(map).map((key) => ({
              name: key,
              value: Number(map[key].toFixed(2)),
              percent: summary.totalValue > 0 ? ((map[key] / summary.totalValue) * 100).toFixed(2) : 0
            }));
          }, [funds, summary.totalValue]);

          const handleUpdateFund = (id, field, value) => {
            setFunds((prev) =>
              prev.map((f) =>
                f.id === id ? { ...f, [field]: field === 'name' || field === 'category' || field === 'ticker' ? value : parseFloat(value) || 0 } : f
              )
            );
          };

          const handleAddFund = (e) => {
            e.preventDefault();
            if (!newFund.name || !newFund.cost || !newFund.currentValue) return;
            const added = {
              id: Date.now().toString(),
              ticker: newFund.ticker,
              name: newFund.name,
              category: newFund.category,
              risk: Number(newFund.risk) || 5,
              units: Number(newFund.units) || 0,
              cost: Number(newFund.cost) || 0,
              currentValue: Number(newFund.currentValue) || 0,
            };
            setFunds([...funds, added]);
            setNewFund({ ticker: '', name: '', category: 'หุ้นไทย (Thai ESG)', risk: 6, units: '', cost: '', currentValue: '' });
          };

          const handleDeleteFund = (id) => { setFunds(funds.filter((f) => f.id !== id)); };
          
          const confirmReset = () => {
            setFunds(INITIAL_FUNDS);
            setShowResetConfirm(false);
          };

          const generatedPrompt = useMemo(() => {
            const lines = funds.map((f, idx) => {
              const pl = f.currentValue - f.cost;
              const plPct = f.cost > 0 ? ((pl / f.cost) * 100).toFixed(2) : '0.00';
              const weight = summary.totalValue > 0 ? ((f.currentValue / summary.totalValue) * 100).toFixed(2) : '0.00';
              return `${idx + 1}. ${f.name} [${f.category} | ความเสี่ยงระดับ ${f.risk}]: ต้นทุน ${f.cost.toLocaleString()} บาท | มูลค่าปัจจุบัน ${f.currentValue.toLocaleString()} บาท | กำไร/ขาดทุน ${pl >= 0 ? '+' : ''}${pl.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท (${pl >= 0 ? '+' : ''}${plPct}%) | สัดส่วน ${weight}% ของพอร์ต`;
            });
            const allocLines = allocationData.map((a) => `- ${a.name}: ${a.value.toLocaleString()} บาท (${a.percent}%)`);
            return `คุณคือผู้จัดการกองทุนส่วนตัวและนักเศรษฐศาสตร์มหภาคระดับอาวุโส
ช่วยวิเคราะห์พอร์ตกองทุนรวมของฉันด้านล่างนี้ ควบคู่กับค้นหาข่าวสถานการณ์เศรษฐกิจและการเมืองทั้งในไทย จีน สหรัฐฯ และทิศทางราคาทองคำ/ดอกเบี้ยล่าสุดในสัปดาห์นี้:

📊 [สรุปภาพรวมพอร์ตปัจจุบัน]
- ต้นทุนรวมทั้งหมด: ${summary.totalCost.toLocaleString(undefined, { minimumFractionDigits: 2 })} บาท
- มูลค่าปัจจุบันรวม: ${summary.totalValue.toLocaleString(undefined, { minimumFractionDigits: 2 })} บาท
- กำไร/ขาดทุนสุทธิ: ${summary.totalPL >= 0 ? '+' : ''}${summary.totalPL.toLocaleString(undefined, { minimumFractionDigits: 2 })} บาท (${summary.totalPL >= 0 ? '+' : ''}${summary.totalPLPercent.toFixed(2)}%)

🥧 [สัดส่วนตามประเภทสินทรัพย์ (Asset Allocation)]
${allocLines.join('\n')}

📋 [รายละเอียดรายกองทุนในพอร์ต]
${lines.join('\n')}

🎯 [สิ่งที่ต้องการให้คุณวิเคราะห์และแนะนำ]
1. วิเคราะห์สถานการณ์เศรษฐกิจและการเมืองปัจจุบัน (ไทย, จีน, สหรัฐฯ, ทิศทางดอกเบี้ย กนง./Fed, และราคาทองคำ) ที่ส่งผลกระทบโดยตรงต่อสินทรัพย์ในพอร์ตของฉัน
2. เจาะลึกคำแนะนำรายกองทุน (ระบุให้ชัดเจนว่าควร "ซื้อเพิ่ม / ถือต่อ / สับเปลี่ยนหรือขายทำกำไร")
3. แนะนำการจัดสัดส่วนพอร์ตใหม่ (Rebalancing) และการวางแผนลดหย่อนภาษีให้เหมาะสมที่สุดในไตรมาสนี้`;
          }, [funds, summary, allocationData]);

          const handleCopyPrompt = () => {
            const textArea = document.createElement("textarea");
            textArea.value = generatedPrompt;
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
            } catch (err) {
              if (navigator.clipboard) navigator.clipboard.writeText(generatedPrompt);
            }
            document.body.removeChild(textArea);

            setCopied(true);
            setShowPromptModal(true);
            setTimeout(() => setCopied(false), 3000);
          };

          const handleSyncPrices = async () => {
            setIsSyncing(true);
            try {
              await new Promise((resolve) => setTimeout(resolve, 1200));
              setFunds((prevFunds) => 
                prevFunds.map((fund) => {
                  if (!fund.ticker) return fund;
                  const currentPriceEstimate = fund.currentValue / (fund.units || 1);
                  const variation = 1 + (Math.random() * 0.04 - 0.02); 
                  const newCurrentValue = fund.units > 0 ? fund.units * (currentPriceEstimate * variation) : fund.currentValue * variation;
                  return { ...fund, currentValue: Number(newCurrentValue.toFixed(2)) };
                })
              );
            } finally { setIsSyncing(false); }
          };

          return (
            <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto space-y-6">
              {/* Header */}
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div>
                  <h1 className="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
                    <TrendingUp className="text-blue-600 w-8 h-8" /> ระบบติดตามพอร์ตกองทุนรวม
                  </h1>
                  <p className="text-slate-500 text-sm mt-1">บันทึกข้อมูลอัตโนมัติในเบราว์เซอร์ • แก้ไขตัวเลขในตารางได้ทันที</p>
                </div>
                <div className="flex flex-wrap gap-3 items-center">
                  <button onClick={handleSyncPrices} disabled={isSyncing} className="flex items-center gap-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-4 py-2.5 rounded-xl text-sm font-medium transition-all cursor-pointer">
                    <RefreshCw className={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`} /> {isSyncing ? 'กำลังซิงค์...' : 'อัปเดตราคาล่าสุด'}
                  </button>
                  <button onClick={handleCopyPrompt} className="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-md cursor-pointer transition-all">
                    {copied ? <Check className="w-5 h-5" /> : <Sparkles className="w-5 h-5" />} {copied ? 'คัดลอกแล้ว!' : 'สร้าง Prompt AI'}
                  </button>
                  
                  {!showResetConfirm ? (
                    <button onClick={() => setShowResetConfirm(true)} className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-all">
                      <RotateCcw className="w-4 h-4" /> รีเซ็ต
                    </button>
                  ) : (
                    <div className="flex items-center gap-2 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-xl">
                      <span className="text-xs text-rose-700 font-medium">ยืนยันรีเซ็ต?</span>
                      <button onClick={confirmReset} className="bg-rose-600 hover:bg-rose-700 text-white text-xs px-2.5 py-1 rounded-lg font-medium cursor-pointer">ใช่</button>
                      <button onClick={() => setShowResetConfirm(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded-lg font-medium cursor-pointer">ยกเลิก</button>
                    </div>
                  )}
                </div>
              </div>

              {/* Summary Cards */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <div className="text-sm text-slate-500 font-medium flex justify-between"><span>มูลค่าพอร์ตปัจจุบัน</span><Wallet className="w-5 h-5 text-blue-500" /></div>
                  <div className="text-3xl font-bold text-slate-900 mt-2">฿{summary.totalValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                  <div className="text-xs text-slate-400 mt-1">จากทั้งหมด {funds.length} กองทุน</div>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <div className="text-sm text-slate-500 font-medium">ต้นทุนรวมทั้งหมด</div>
                  <div className="text-3xl font-bold text-slate-700 mt-2">฿{summary.totalCost.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                  <div className="text-xs text-slate-400 mt-1">เงินลงทุนตั้งต้นสะสม</div>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <div className="text-sm text-slate-500 font-medium flex justify-between"><span>กำไร/ขาดทุนสุทธิ</span>{summary.totalPL >= 0 ? <ArrowUpRight className="w-5 h-5 text-emerald-500" /> : <ArrowDownRight className="w-5 h-5 text-rose-500" />}</div>
                  <div className={`text-3xl font-bold mt-2 ${summary.totalPL >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {summary.totalPL >= 0 ? '+' : ''}฿{summary.totalPL.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                  </div>
                  <div className={`text-sm font-semibold mt-1 ${summary.totalPL >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>({summary.totalPL >= 0 ? '+' : ''}{summary.totalPLPercent.toFixed(2)}%)</div>
                </div>
              </div>

              {/* Charts */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">🥧 สัดส่วนสินทรัพย์ (Asset Allocation)</h2>
                  <div className="h-72">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie data={allocationData} cx="50%" cy="50%" innerRadius={60} outerRadius={90} paddingAngle={3} dataKey="value" label={({name, percent}) => `${name} (${percent}%)`}>
                          {allocationData.map((e, i) => <Cell key={`cell-${i}`} fill={COLORS[i % COLORS.length]} />)}
                        </Pie>
                        <Tooltip formatter={(v) => `฿${Number(v).toLocaleString()}`} />
                        <Legend />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">📊 กำไร/ขาดทุน รายกองทุน (THB)</h2>
                  <div className="h-72">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={funds.map(f => ({ name: f.name.length > 12 ? f.name.substring(0, 12) + '...' : f.name, pl: Number((f.currentValue - f.cost).toFixed(2)) }))} margin={{ top: 10, right: 20, left: 10, bottom: 40 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                        <XAxis dataKey="name" angle={-25} textAnchor="end" interval={0} height={60} tick={{ fontSize: 11 }} />
                        <YAxis tick={{ fontSize: 12 }} />
                        <Tooltip formatter={(v) => [`฿${Number(v).toLocaleString()}`, 'กำไร/ขาดทุน']} />
                        <Bar dataKey="pl" radius={[6, 6, 0, 0]}>
                          {funds.map((f, i) => <Cell key={`bar-${i}`} fill={f.currentValue - f.cost >= 0 ? '#10b981' : '#ef4444'} />)}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>

              {/* Table */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-6 border-b border-slate-200">
                  <h2 className="text-lg font-bold text-slate-800">📋 ตารางจัดการพอร์ตกองทุน</h2>
                  <p className="text-xs text-slate-500">คลิกที่ช่องตัวเลขในตารางเพื่อแก้ไขต้นทุนหรือมูลค่าปัจจุบันได้ทันที</p>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50 text-slate-600 text-xs uppercase border-b border-slate-200">
                        <th className="p-4 whitespace-nowrap">Ticker</th>
                        <th className="p-4 whitespace-nowrap">ชื่อกองทุน</th>
                        <th className="p-4 whitespace-nowrap">หมวดหมู่</th>
                        <th className="p-4 text-center whitespace-nowrap">ความเสี่ยง</th>
                        <th className="p-4 text-right whitespace-nowrap">จำนวนหน่วย</th>
                        <th className="p-4 text-right whitespace-nowrap">ต้นทุน (THB)</th>
                        <th className="p-4 text-right whitespace-nowrap">มูลค่าปัจจุบัน (THB)</th>
                        <th className="p-4 text-right whitespace-nowrap">กำไร/ขาดทุน</th>
                        <th className="p-4 text-right whitespace-nowrap">สัดส่วน</th>
                        <th className="p-4 text-center whitespace-nowrap">ลบ</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 text-sm">
                      {funds.map((fund) => {
                        const pl = fund.currentValue - fund.cost;
                        const plPct = fund.cost > 0 ? (pl / fund.cost) * 100 : 0;
                        const weight = summary.totalValue > 0 ? (fund.currentValue / summary.totalValue) * 100 : 0;
                        return (
                          <tr key={fund.id} className="hover:bg-slate-50 transition-colors">
                            <td className="p-3"><input type="text" value={fund.ticker || ''} placeholder="เช่น K-USA" onChange={(e) => handleUpdateFund(fund.id, 'ticker', e.target.value)} className="w-24 bg-transparent border border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-white rounded px-2 py-1 text-xs font-mono text-blue-600 outline-none" /></td>
                            <td className="p-3"><input type="text" value={fund.name} onChange={(e) => handleUpdateFund(fund.id, 'name', e.target.value)} className="w-full min-w-[140px] bg-transparent border border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-white rounded px-2 py-1 font-semibold outline-none" /></td>
                            <td className="p-3">
                              <select value={fund.category} onChange={(e) => handleUpdateFund(fund.id, 'category', e.target.value)} className="bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 text-xs font-medium text-slate-700 outline-none">
                                <option value="หุ้นไทย (Thai ESG)">หุ้นไทย (Thai ESG)</option>
                                <option value="ตราสารหนี้ไทย (Thai ESG)">ตราสารหนี้ไทย (Thai ESG)</option>
                                <option value="ทองคำ (Gold RMF)">ทองคำ (Gold RMF)</option>
                                <option value="หุ้นจีน (China SSF)">หุ้นจีน (China SSF)</option>
                                <option value="ตลาดเงิน (Money Market)">ตลาดเงิน (Money Market)</option>
                                <option value="หุ้นสหรัฐฯ / โลก">หุ้นสหรัฐฯ / โลก</option>
                                <option value="อื่นๆ">อื่นๆ</option>
                              </select>
                            </td>
                            <td className="p-3 text-center"><input type="number" min="1" max="8" value={fund.risk} onChange={(e) => handleUpdateFund(fund.id, 'risk', e.target.value)} className="w-12 text-center bg-slate-100 rounded py-1 text-xs font-bold outline-none" /></td>
                            <td className="p-3 text-right"><input type="number" step="0.0001" value={fund.units} onChange={(e) => handleUpdateFund(fund.id, 'units', e.target.value)} className="w-24 text-right bg-transparent border border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-white rounded px-2 py-1 outline-none" /></td>
                            <td className="p-3 text-right"><input type="number" step="0.01" value={fund.cost} onChange={(e) => handleUpdateFund(fund.id, 'cost', e.target.value)} className="w-28 text-right bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded px-2 py-1 font-medium outline-none" /></td>
                            <td className="p-3 text-right"><input type="number" step="0.01" value={fund.currentValue} onChange={(e) => handleUpdateFund(fund.id, 'currentValue', e.target.value)} className="w-28 text-right bg-blue-50/50 border border-blue-200 focus:border-blue-500 focus:bg-white rounded px-2 py-1 font-bold text-slate-900 outline-none" /></td>
                            <td className={`p-3 text-right font-semibold whitespace-nowrap ${pl >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                              <div>{pl >= 0 ? '+' : ''}{pl.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                              <div className="text-xs">({pl >= 0 ? '+' : ''}{plPct.toFixed(2)}%)</div>
                            </td>
                            <td className="p-3 text-right text-slate-600 font-medium">{weight.toFixed(2)}%</td>
                            <td className="p-3 text-center"><button onClick={() => handleDeleteFund(fund.id)} className="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 cursor-pointer transition-colors"><Trash2 className="w-4 h-4" /></button></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* Add New Fund Form */}
                <form onSubmit={handleAddFund} className="p-4 bg-slate-50 border-t border-slate-200">
                  <div className="text-xs font-bold text-slate-600 uppercase mb-3 flex items-center gap-1">
                    <Plus className="w-4 h-4 text-blue-600" /> เพิ่มรายการกองทุนใหม่
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-8 gap-3">
                    <input type="text" placeholder="Ticker (ถ้ามี)" value={newFund.ticker} onChange={(e) => setNewFund({ ...newFund, ticker: e.target.value })} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono outline-none focus:border-blue-500" />
                    <input type="text" placeholder="ชื่อกองทุน *" value={newFund.name} onChange={(e) => setNewFund({ ...newFund, name: e.target.value })} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500" required />
                    <select value={newFund.category} onChange={(e) => setNewFund({ ...newFund, category: e.target.value })} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500">
                      <option value="หุ้นไทย (Thai ESG)">หุ้นไทย (Thai ESG)</option>
                      <option value="ตราสารหนี้ไทย (Thai ESG)">ตราสารหนี้ไทย (Thai ESG)</option>
                      <option value="ทองคำ (Gold RMF)">ทองคำ (Gold RMF)</option>
                      <option value="หุ้นจีน (China SSF)">หุ้นจีน (China SSF)</option>
                      <option value="ตลาดเงิน (Money Market)">ตลาดเงิน (Money Market)</option>
                      <option value="หุ้นสหรัฐฯ / โลก">หุ้นสหรัฐฯ / โลก</option>
                      <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                    <input type="number" step="0.0001" placeholder="จำนวนหน่วย" value={newFund.units} onChange={(e) => setNewFund({ ...newFund, units: e.target.value })} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500" />
                    <input type="number" step="0.01" placeholder="ต้นทุนรวม (บาท) *" value={newFund.cost} onChange={(e) => setNewFund({ ...newFund, cost: e.target.value })} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500" required />
                    <input type="number" step="0.01" placeholder="มูลค่าปัจจุบัน *" value={newFund.currentValue} onChange={(e) => setNewFund({ ...newFund, currentValue: e.target.value })} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500" required />
                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl px-4 py-2 text-sm md:col-span-2 cursor-pointer flex items-center justify-center gap-1 shadow-sm transition-colors">
                      <Plus className="w-4 h-4" /> เพิ่มกองทุน
                    </button>
                  </div>
                </form>
              </div>

              {/* Prompt Modal */}
              {showPromptModal && (
                <div className="bg-indigo-950 text-indigo-100 p-6 rounded-2xl shadow-lg border border-indigo-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-lg text-white flex items-center gap-2">
                      <Sparkles className="w-5 h-5 text-amber-400" /> Prompt สำหรับนำไปวางใน Gemini / AI (คัดลอกลงคลิปบอร์ดแล้ว!)
                    </h3>
                    <button onClick={() => setShowPromptModal(false)} className="text-xs text-indigo-300 hover:text-white underline cursor-pointer">ซ่อนหน้าต่างนี้</button>
                  </div>
                  <pre className="bg-indigo-900/60 p-4 rounded-xl text-xs md:text-sm overflow-x-auto whitespace-pre-wrap font-mono leading-relaxed border border-indigo-800">{generatedPrompt}</pre>
                  <div className="flex justify-end">
                    <button onClick={handleCopyPrompt} className="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm cursor-pointer">
                      <Copy className="w-4 h-4" /> คัดลอกซ้ำอีกครั้ง
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
